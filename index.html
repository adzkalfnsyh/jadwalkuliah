<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Kuliah Adzka</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4.5' width='18' height='16.5' rx='2'/%3E%3Cpath d='M3 10h18'/%3E%3Cpath d='M8 2.5v4'/%3E%3Cpath d='M16 2.5v4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var tema = localStorage.getItem("tema");
        if (tema === "gelap" || tema === "terang") {
          document.documentElement.dataset.tema = tema;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="16.5" rx="2"></rect>
            <path d="M3 10h18"></path>
            <path d="M8 2.5v4"></path>
            <path d="M16 2.5v4"></path>
            <path d="M8 14h2"></path>
            <path d="M14 14h2"></path>
            <path d="M8 17.5h2"></path>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">Jadwal Kuliah Adzka</div>
          <div class="brand-sub" id="info-semester"></div>
        </div>
      </div>
      <div class="header-right">
        <div class="identity">
          <div class="identity-top">
            <span id="info-nama"></span>
            <span class="sep">,</span>
            <span id="info-nim"></span>
          </div>
          <div class="identity-bottom">
            <span id="info-kelas"></span>
            <span class="sep">,</span>
            <span id="info-prodi"></span>
          </div>
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Ganti tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="M4.93 4.93l1.41 1.41"></path>
            <path d="M17.66 17.66l1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="M4.93 19.07l1.41-1.41"></path>
            <path d="M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-time" id="jam-sekarang"></div>
    </section>

    <section class="section">
      <h2 class="section-title" id="judul-kuliah">Kuliah berikutnya</h2>
      <div id="kuliah-berikutnya"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Jadwal mingguan</h2>
      <div id="daftar-hari"></div>
    </section>
  </main>

  <footer class="site-footer">
    Website jadwal kuliah pribadi · Muhammad Adzka Alfiansyah
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
